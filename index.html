.c-rose{--accent:var(--rose);--soft:var(--rose-soft)}
body[data-view="sales"] .ex:not(.good){--accent:var(--rose);--soft:var(--rose-soft)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.85 var(--round);letter-spacing:.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;line-height:1.35}

.top{position:sticky;top:0;z-index:5;background:var(--bg)}
.top-in{max-width:860px;margin:auto;padding:10px 16px}
.brand{display:inline-block;font-size:17px;font-weight:700;color:var(--accent);margin:0 0 6px 4px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;background:var(--surface);border-radius:99px;box-shadow:var(--shadow)}
.tabs a{padding:6px 2px;text-align:center;font-size:15px;color:var(--muted);border-radius:99px}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on)}

main{max-width:860px;margin:auto;padding:10px 16px 72px}
.hero{display:grid;gap:12px;padding:34px 26px;border-radius:30px;color:#fff;background:linear-gradient(125deg,#85596A,#8F6468 55%,#8E6F5E)}
.hero h1{font-size:clamp(33px,8vw,50px)}
.hero p{max-width:30em;color:#F8F1F0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stats span{padding:2px 13px;border-radius:99px;background:rgba(255,255,255,.2);font-size:14.5px}

.head{display:grid;gap:6px;padding:24px;margin-bottom:18px;background:var(--soft);border-radius:26px}
.head h2{font-size:clamp(26px,6vw,36px);color:var(--accent)}
.head p{max-width:34em}

.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px;margin-bottom:22px}
.home-rings{margin:24px 0 26px}
.ring{display:grid;justify-items:center;gap:5px;font-size:14.5px;line-height:1.3;padding:0}
.ring b{display:grid;place-items:center;width:min(62px,15vw);aspect-ratio:1;border-radius:50%;font-size:21px;font-weight:400;color:var(--rose);background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#B8929A,#C4AE98) border-box;border:3px solid transparent}
.ring[aria-pressed="true"] b{color:#fff;background:linear-gradient(135deg,#8A5F6C,#8E6F5E) border-box}
.ring[aria-pressed="true"]{color:var(--rose)}

.topics{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.topic{display:grid;gap:4px;align-content:start;padding:22px;background:var(--soft);border-radius:26px}
.topic i{justify-self:start;padding:0 11px;border-radius:99px;font-style:normal;font-size:13.5px;background:var(--accent);color:var(--on)}
.topic b{font-size:22px;font-weight:700;line-height:1.45;color:var(--accent);margin-top:6px}
.topic span{font-size:15px;color:var(--ink)}
.topic:hover{outline:2px solid var(--accent)}

.list{display:grid;gap:16px}
.card{background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.card h3{display:flex;gap:10px;font-size:19px;line-height:1.55;font-weight:700;margin-bottom:10px}
.num{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:15px;font-weight:400;font-variant-numeric:tabular-nums}
.lines{display:grid;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{padding:6px 17px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:15px}
.btn:hover{outline:2px solid var(--accent)}
.btn.main{background:var(--accent);color:var(--on)}
.btn:disabled{opacity:.4;cursor:default;outline:0}

.label{display:inline-block;font-size:14px;color:var(--accent);margin-bottom:3px}
.label.good{color:var(--good)}

.gc{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:center}
.rings3{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:auto}
.rings3 div{position:absolute;border-radius:50%;display:grid;justify-items:center;align-content:start;text-align:center;line-height:1.3}
.rings3 .o{inset:0;background:var(--teal-soft);color:var(--teal);padding-top:12px}
.rings3 .m{inset:19%;background:var(--rose-soft);color:var(--rose);padding-top:10px}
.rings3 .c{inset:38%;background:var(--accent);color:var(--on);align-content:center}
.rings3 b{font-size:15px;letter-spacing:.06em}.rings3 small{font-size:12.5px}
.gc-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.gc-list b{color:var(--accent)}
.pts{display:grid;gap:6px;margin-top:14px;padding:14px 17px;border:2px dashed var(--accent);border-radius:20px}
.chat{display:grid;gap:8px;margin-top:14px}
.chat .t{font-size:14px;color:var(--muted);margin-bottom:2px}
.msg{max-width:86%;padding:9px 15px;border-radius:18px;font-size:16px;line-height:1.7}
.msg.them{justify-self:start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{justify-self:end;background:var(--accent);color:var(--on);border-bottom-right-radius:5px}
.msg em{display:block;font-style:normal;font-size:12.5px;opacity:.85}
.rad{display:block;width:100%;max-width:480px;margin:auto;font-family:var(--round)}
.r-ln{stroke:var(--line);stroke-width:2}
.r-ring{fill:none;stroke:var(--line);stroke-dasharray:4 6}
.r-ctr{fill:var(--accent)}
.r-ct{fill:var(--on);font-size:24px;font-weight:700}
.r-node circle{fill:var(--soft);stroke:var(--accent);stroke-width:2}
.r-nt{fill:var(--accent);font-size:16.5px}
.r-out rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.r-ot{fill:var(--ink);font-size:15px}
.r-node[data-gi]{cursor:pointer}
.r-node.on circle{fill:var(--accent)}.r-node.on .r-nt{fill:var(--on)}
.r-out.on rect{stroke:var(--accent);stroke-width:2.5}
.r-node:focus-visible{outline:none}.r-node:focus-visible circle{stroke-width:4}
.card.sel{outline:2.5px solid var(--accent)}
.rad.dim .r-ctr{fill:var(--muted)}.rad.dim .r-node circle{fill:var(--bg);stroke:var(--muted)}.rad.dim .r-nt{fill:var(--muted)}
.cap{text-align:center;color:var(--muted);font-size:15px;margin-top:4px}
.note{margin-top:12px;font-size:14px;color:var(--muted)}
.tip{display:grid;gap:4px;margin-top:12px;padding:14px 17px;border:2px dashed var(--accent);border-radius:20px}
.new{flex:none;align-self:center;margin-left:auto;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:400;background:var(--soft);color:var(--accent);white-space:nowrap}
.ex{margin-top:14px;padding:14px 17px;background:var(--soft);border-radius:20px 20px 20px 6px}
.ex.good{background:var(--good-soft);border-radius:20px 20px 6px 20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:14px;padding:1px 12px;border-radius:99px;background:var(--soft);color:var(--accent)}
.flow{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.flow li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.flow li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on);font-size:15px}
.sec{font-size:24px;margin:36px 0 2px;color:var(--accent)}
.sub{color:var(--muted);margin-bottom:14px}
.core{padding:20px 24px;background:var(--accent);color:var(--on);border-radius:24px;font-size:21px;line-height:1.6;margin-bottom:8px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.bul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.bul li::marker{color:var(--accent)}

dialog{width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:0;border-radius:28px;padding:20px 22px 22px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(50,44,44,.62)}
.bar{display:flex;gap:4px;margin-bottom:12px}
.bar i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.bar i.on{background:var(--accent)}
.d-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:12px}
#pText{display:grid;gap:10px;font-size:clamp(21px,4.8vw,26px);line-height:1.7;margin-bottom:20px}
#pText p:first-child{font-weight:700;color:var(--accent)}
.d-nav{display:flex;justify-content:space-between;gap:8px}
[hidden]{display:none!important}
@media (max-width:420px){.tabs a{font-size:13px;letter-spacing:0}.hero{padding:28px 22px}.card{padding:19px}}
</style>
</head>

<script>
const K=[
{id:"slim",n:"纖體",s:[
`荷爾蒙平衡瘦身法更適合大家的原因是
不用辛苦節食、減肥，是從根本修復身體的「代謝開關」與「食慾訊號」～讓身體自己開始消耗脂肪！！
而且因為符合生理機能（所以瘦下來也更不會復胖唷）`,
`過度節食、熬夜或高強度運動會讓皮質醇降不下來
這時候…脂肪優先囤積在腹部與腰間變成壓力人小腹！
也是很多人很瘦但是就是有小腹的原因！！`,

{id:"cocoa",n:"可可奶茶",s:[

①備孕期間：足夠營養胚胎會更健康✅ 提高受孕機率✅ 降低胎兒發育異常問題✅
②孕期中補充：避免孕吐不適營養不足✅ 胎兒發育必須營養充足✅ 預防孕期併發✅ 降低孕期疲勞✅

`想瘦身但很容易瘦不下來
很有可能是營養不足！
因為身體在缺乏關鍵營養素與足夠熱量時，會自動啟動「節能求生機制」並降低燃脂效率
蛋白質不夠還會掉肌肉！！！！

核心原理是「熱量赤字」本身沒有燃脂成分
是透過增加飽足讓大家減少食慾
同時加上其他營養補充幫助身體機能～～

所以還是要用更健康的方式唷，飲食＋輔助效果更好`]},
{id:"purple",n:"紫纖飲",s:[
`如果你平常戒不掉手搖飲、吃飯常配含糖飲料、或是吃完澱粉容易想睡覺與水腫
紫纖飲絕對是拯救你的秘密武器
從源頭減少醣類負擔～直接減少餐後40%醣類吸收

`穩定血糖除了能幫助減重＆避免脂肪囤積外
最直接的好處是「大幅提升白天的專注力與精神狀態」、延緩皮膚老化
還可以降低慢性發炎唷
同時…還可以幫助情緒穩定`,
`我想很多人都不知道血糖過高會造成膠原蛋白流失更快
沒有女生希望自己暗沉、蠟黃、皮膚鬆吧！！！
同時如果下巴、臉頰很容易反覆長痘痘也試過各種方式都沒有改善
也很推薦試試「戒糖」
血糖穩定以後膚況狀態也會更好喔`]},
{id:"skin",n:"美肌",s:[
`美白到底是不是智商稅
要看你到底用了什麼～～
一樣都是傳明酸政府核可的美白成分
為什麼有的就是沒感覺？關鍵在劑量！！
高達2.92%才能真正有效作用呀！！`,
`以前總覺得專櫃保養就是好
後面才發現自己連洗臉都有問題
除了把毛孔洗乾淨以外還可以保護「皮膚屏障」～～所以不要洗臉總是隨便擦一擦而已`,
`主打一片就能同時完成抗老緊緻、深層補水與敏弱修護
敢這樣說真的是因為他有資格～
光是專櫃同款成分「繃帶普拉斯™（普拉斯鏈）」看到就知道多厲害了
促進膠原蛋白讓臉更澎潤，這個成分絕對不會不認識！！`,
`「乳霜質地」與「一般水狀精華」面膜的根本差異，在於「油水比例」與「鎖水機制」
油水不平衡就很容易越敷越乾
乾肌、想抗老、醫美術後單純只靠水是沒用的，還需要脂質填補角質間隙！才能敷完更有感`,
`老實說，市面上膠原蛋白這麼多，很多人買回家吃不到一半就放在櫃子裡生灰塵
通常都是因為『有腥味不敢吃』或是『還要找水泡很麻煩』。
但...如果想找一個更全方位的口服保養這一顆抵三罐
玻尿酸（補水）＋賽洛美（鎖水）＋胜肽膠原蛋白（澎潤）＋藻紅素（抗氧化提亮）
全部濃縮在裡面，而且每顆只有 1.5 大卡、完全無糖。
不用擔心為了變美反而喝進一堆果汁粉跟熱量，對正在飲食控制的人超級友善`]},
{id:"hair",n:"美髮",s:[
`洗頭時最煩的兩個問題：想控油蓬鬆，頭髮就會乾澀打結
想滋潤柔順，頭皮下午就出油扁塌

`市售很多生髮水含有藥性成分，不僅容易引起頭皮搔癢、狂脫期，一旦停用還會打回原形，甚至孕婦完全不能碰
法樂蓬通過亞洲最大的 Ellead® 人體臨床實驗認證，實測 4 週能有效活化頭皮、強健髮根
最重要的是它無西藥、無雌激素、無矽靈、無 SLS/SLES，
連產後掉髮的哺乳媽媽、孕婦，甚至 3 歲以上的小孩都能一起洗`,
`掉髮問題到底困擾多少人？

跟你們說要一起搭配最大原因就是除了清潔還要吸收！`,
`如果你漂過頭髮，那你選洗髮精的痛苦指數絕對是一般人的十倍
漂後受損最怕「越吹越毛」，這瓶把吹風機的熱風變成「護髮神器」
「熱反應角蛋白技術」——平常漂髮最怕吹風機的高溫傷害，但這瓶的成分遇到吹風機熱風時，反而會被啟動、在受損的毛鱗片外層形成保護膜
漂髮時頭皮受過化學藥劑刺激，更需要「無藥性、低敏」的養髮精華

{id:"probiotic",n:"益生菌",s:[
`容易腹瀉、腸躁、排便不順到底為什麼要吃益生菌？
平衡菌叢生態：壞菌更多時就很容易出現這些問題，補充好菌可以抑制壞菌
強化腸道屏障、透過「腸腦軸」調節敏感反應

`胃食道逆流、腸胃不舒服
可能很多人會先去藥局買益生菌
如果有適合的當然很棒，但提醒你們一定要特別注意出場後的活菌數

菌株更重要！舉例這張鈔票面額超大，但他幣值不到台幣1塊錢
如果是你們要選這個鈔票還是台幣一塊？
所以挑對菌株、是不是能夠存活到腸道，活不到就沒辦法被吸收啦、是不是有研究文獻證明。
同時更要記得搭配益生質，才能提供給益生菌需要的養分，效果才會更好`,
`哪些人需要補充益生菌？

let pp="slim", gsel=-1;
function radial(center,nodes,sel,cls){
  const n=nodes.length,many=n>5,C=240,CY=220,R1=many?142:118,NR=many?42:47;
  const pos=(r,i)=>{const a=(-90+360*i/n)*Math.PI/180;return [C+r*Math.cos(a),CY+r*Math.sin(a)]};
  const tx=(x,y,s,c)=>{const L=s.split("\n"),h=c==="r-ct"?28:20;return `<text class="${c}" x="${x}" y="${y-(L.length-1)*h/2}" text-anchor="middle" dominant-baseline="central">${L.map((l,k)=>`<tspan x="${x}" dy="${k?h:0}">${esc(l)}</tspan>`).join("")}</text>`};
  let g="";
  [1,1.62].forEach(k=>g+=`<circle class="r-ring" cx="${C}" cy="${CY}" r="${R1*k*.62}"/>`);
  nodes.forEach((d,i)=>{const [x1,y1]=pos(R1,i);g+=`<line class="r-ln" x1="${C}" y1="${CY}" x2="${x1}" y2="${y1}"/>`});
  if(!many) nodes.forEach((d,i)=>{if(!d.tag)return;const [x1,y1]=pos(R1,i),up=y1<CY-10,y2=up?y1-NR-21:y1+NR+21;
    g+=`<line class="r-ln" x1="${x1}" y1="${y1}" x2="${x1}" y2="${y2}"/>`;const w=d.tag.length*15.5+26;
    g+=`<g class="r-out${i===sel?" on":""}"><rect x="${x1-w/2}" y="${y2-17}" width="${w}" height="34" rx="17"/>${tx(x1,y2,d.tag,"r-ot")}</g>`});
  nodes.forEach((d,i)=>{const [x1,y1]=pos(R1,i);
    g+=`<g class="r-node${i===sel?" on":""}" ${sel!==undefined?`data-gi="${i}" role="button" tabindex="0" aria-label="${esc(d.n||d.w)}"`:""}><circle cx="${x1}" cy="${y1}" r="${NR}"/>${tx(x1,y1,d.w,"r-nt")}</g>`});
  g+=`<circle class="r-ctr" cx="${C}" cy="${CY}" r="56"/>${tx(C,CY,center,"r-ct")}`;
  return `<svg class="rad ${cls||""}" viewBox="0 0 480 440" role="img" aria-label="${esc(center.replace("\n",""))}：${nodes.map(d=>(d.n||d.w).replace("\n","")).join("、")}">${g}</svg>`;
}

<div class="rings">${K.map(x=>`<button class="ring" type="button" data-pp="${x.id}" aria-pressed="${x.id===pp}"><b>${G[x.id]}</b>${x.n}</button>`).join("")}</div>

${g.note?`<p class="note">⚠️ ${esc(g.note)}</p>`:""}</article>`).join("")}</div>`;
}

const views={home,knowledge,daily,sales,myths,people};
function show(v,keep){
  if(!views[v]) v="home";
  clips=[]; cur=v; document.body.dataset.view=v; app.innerHTML=views[v]();
  document.querySelectorAll(".tabs a").forEach(a=>a.dataset.go===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(!keep) scrollTo(0,0);
}
function route(){const h=location.hash.slice(1);const k=K.find(x=>"knowledge-"+x.id===h);const q=K.find(x=>"people-"+x.id===h);if(q){pp=q.id;gsel=-1;show("people")}else if(k){product=k.id;show("knowledge")}else show(h||"home")}

const dlg=document.getElementById("practice");
function say(){
  document.getElementById("pText").innerHTML=paras(deck[at]);
  document.getElementById("pCount").textContent=`${K.find(x=>x.id===product).n}　${at+1} / ${deck.length}`;
  document.getElementById("pBar").innerHTML=deck.map((_,i)=>`<i class="${i<=at?"on":""}"></i>`).join("");
  document.getElementById("pPrev").disabled=at===0;
  document.getElementById("pNext").textContent=at===deck.length-1?"完成":"下一則";
  dlg.scrollTop=0;
}
document.getElementById("pClose").onclick=()=>dlg.close();
document.getElementById("pPrev").onclick=()=>{if(at>0){at--;say()}};
document.getElementById("pNext").onclick=()=>{if(at<deck.length-1){at++;say()}else dlg.close()};

document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]");
  if(go){e.preventDefault();const v=go.dataset.go;try{history.replaceState(null,"","#"+v)}catch(_){}show(v);return}
  const q=e.target.closest("[data-pp]");
  if(q){pp=q.dataset.pp;gsel=-1;try{history.replaceState(null,"","#people-"+pp)}catch(_){}show("people",true);return}
  const gi=e.target.closest("[data-gi]");
  if(gi){gsel=+gi.dataset.gi;show("people",true);const el=document.getElementById("g"+gsel);if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  const p=e.target.closest("[data-p]");
  if(p){product=p.dataset.p;try{history.replaceState(null,"","#knowledge-"+product)}catch(_){}show("knowledge",cur==="knowledge");return}
  const s=e.target.closest("[data-say]");
  if(s){at=+s.dataset.say;say();dlg.showModal();return}
  const c=e.target.closest("[data-copy]");
  if(c){try{await navigator.clipboard.writeText(clips[+c.dataset.copy]);c.textContent="已複製"}catch(_){c.textContent="請長按文字複製"}setTimeout(()=>c.textContent="複製文案",1600)}
});
addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-gi]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
route();
